name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    with:
      release_tag: ${{ github.ref_name }}
      repository_url: https://github.com/${{ github.repository }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cliproxy-account-warmup-*
          path: release
          merge-multiple: true
      - name: Check release assets and create checksums
        working-directory: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          platforms=(darwin_amd64 darwin_arm64 linux_amd64 linux_arm64 windows_amd64)
          archives=()
          for platform in "${platforms[@]}"; do
            archive="cliproxy-account-warmup_${version}_${platform}.zip"
            test -f "$archive"
            archives+=("$archive")
          done
          sha256sum "${archives[@]}" > checksums.txt
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/*.zip release/checksums.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --draft \
            --notes 'Native plugin builds for Windows, Linux, and macOS.'
