<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <title>Account Warmup</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="workspace">
      <header class="toolbar">
        <div class="toolbar-summary">
          <span class="toolbar-icon" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M4.5 18a9 9 0 1 1 15 0M12 12l4-4" />
              <circle cx="12" cy="12" r="1" />
            </svg>
          </span>
          <h1 id="account-summary">Account Warmup</h1>
        </div>
        <button
          id="refresh-button"
          class="button secondary"
          type="button"
          disabled
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"
            />
          </svg>
          Refresh accounts
        </button>
      </header>

      <div id="notice" class="notice" role="alert" hidden></div>

      <div class="provider-tabs" role="tablist" aria-label="Provider">
        <button
          id="claude-tab"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="claude-panel"
          data-provider-tab="claude"
        >
          <img class="provider-icon" src="./claude.svg" alt="" />
          Claude <span class="account-count">0</span>
        </button>
        <button
          id="codex-tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="codex-panel"
          tabindex="-1"
          data-provider-tab="codex"
        >
          <img class="provider-icon" src="./codex.svg" alt="" />
          Codex <span class="account-count">0</span>
        </button>
      </div>

      <section
        id="claude-panel"
        class="provider-panel"
        data-provider="claude"
        role="tabpanel"
        aria-labelledby="claude-tab"
      >
        <div class="provider-controls">
          <div class="provider-details">
            <div class="model-line">
              <span class="model-value">claude-haiku-5-5</span
              ><span class="model-effort">Thinking off · 1-token limit</span>
            </div>
            <div class="selection-bar">
              <span class="selection-count">No accounts loaded</span>
              <button class="text-button select-all" type="button" disabled>
                Select eligible
              </button>
              <button
                class="text-button clear-selection"
                type="button"
                disabled
              >
                Clear
              </button>
            </div>
          </div>
          <div class="provider-actions">
            <button class="button secondary stop-button" type="button" hidden>
              Stop
            </button>
            <button class="button warm-button" type="button" disabled>
              Warm up Claude
            </button>
          </div>
        </div>
        <div class="run-progress" hidden>
          <div class="progress-label">
            <span class="progress-message" role="status"></span
            ><span class="progress-count"></span>
          </div>
          <progress
            max="1"
            value="0"
            aria-label="Claude warmup progress"
          ></progress>
        </div>
        <div class="account-list" aria-label="Claude accounts"></div>
      </section>

      <section
        id="codex-panel"
        class="provider-panel"
        data-provider="codex"
        role="tabpanel"
        aria-labelledby="codex-tab"
        hidden
      >
        <div class="provider-controls">
          <div class="provider-details">
            <div class="model-line">
              <span class="model-value">gpt-6-luna</span
              ><span class="model-effort">Low reasoning</span>
            </div>
            <div class="selection-bar">
              <span class="selection-count">No accounts loaded</span>
              <button class="text-button select-all" type="button" disabled>
                Select eligible
              </button>
              <button
                class="text-button clear-selection"
                type="button"
                disabled
              >
                Clear
              </button>
            </div>
          </div>
          <div class="provider-actions">
            <button class="button secondary stop-button" type="button" hidden>
              Stop
            </button>
            <button class="button warm-button" type="button" disabled>
              Warm up Codex
            </button>
          </div>
        </div>
        <div class="run-progress" hidden>
          <div class="progress-label">
            <span class="progress-message" role="status"></span
            ><span class="progress-count"></span>
          </div>
          <progress
            max="1"
            value="0"
            aria-label="Codex warmup progress"
          ></progress>
        </div>
        <div class="account-list" aria-label="Codex accounts"></div>
      </section>

      <footer class="page-footer">
        <span>Results confirm requests, not quota reset times.</span>
        <div class="connection">
          <span id="last-refreshed"></span>
          <span
            id="connection-dot"
            class="connection-dot"
            aria-hidden="true"
          ></span>
          <span id="connection-label">Not connected</span>
        </div>
      </footer>
      <noscript
        ><p class="notice">
          JavaScript is required to warm up accounts.
        </p></noscript
      >
    </main>

    <template id="account-template">
      <label class="account-row">
        <span class="account-heading">
          <span class="account-icon" aria-hidden="true"></span>
          <span class="account-body"
            ><span class="account-label"></span
            ><span class="account-provider"></span
          ></span>
          <input class="account-checkbox" type="checkbox" />
        </span>
        <span class="account-meta"><span class="account-status"></span></span>
        <span class="account-detail"></span>
      </label>
    </template>
  </body>
</html>
